<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>レシートアップローダ</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="shortcut icon" type="image/png" href="./assets/icon.png" />
    <link
      rel="apple-touch-icon"
      href="./assets/apple-touch-icon.png"
      sizes="180x180"
    />
    <link
      rel="icon"
      type="image/png"
      href="./assets/android-touch-icon.png"
      sizes="192x192"
    />

    <style type="text/css">
      :root {
        --accent: #97abc3;
        --accent-dark: #7d93ad;
        --text: #333;
        --text-sub: #888;
        --bg: #f2f5f8;
        --card-bg: #fff;
        --border: #c9d4e0;
        --radius: 10px;
        --font:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans",
          "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", "游ゴシック Medium",
          Meiryo, sans-serif;
      }
      html {
        font-size: 62.5%;
      }
      body {
        font-size: 2rem;
        margin: 0px;
        text-align: center;
        color: var(--text);
        background-color: var(--bg);
        font-family: var(--font);
      }
      a {
        color: var(--accent);
      }
      header {
        padding-top: 16px;
        font-size: 1.3rem;
        color: var(--text-sub);
      }
      @media (max-width: 670px) {
        /* スマホ */
        main {
          margin: 0 auto;
          width: 100%;
        }
        .cp_contents {
          margin: 12px;
        }
        .cp_button,
        .cp_file {
          width: 80%;
        }
      }
      @media (min-width: 671px) {
        /* タブレット・パソコン */
        main {
          margin: 0 auto;
          width: 671px;
        }
        .cp_contents {
          margin: 20px;
        }
        .cp_button,
        .cp_file {
          width: 380px;
        }
      }
      .cp_contents {
        background-color: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 20px;
      }
      .cp_error {
        color: #f00;
        font-weight: bold;
      }
      .result-table {
        min-height: 130px;
        width: 100%;
        border: 2px solid var(--border);
        border-radius: var(--radius);
        margin: 10px 0px 0px 0px;
        padding: 1.2rem 0;
        font-size: 1.8rem;
        box-sizing: border-box;
        display: none;
      }
      .cp_sparater {
        height: 10px;
      }

      /* 処理中スピナー */
      .spinner {
        margin: 12px auto 4px auto;
        width: 36px;
        height: 36px;
        border: 4px solid #dde5ee;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* インプット */
      .cp_input {
        margin: 10px 0px;
        box-sizing: border-box;
        width: 100%;
        height: 6rem;
        padding: 0 1.3rem;
        letter-spacing: 1px;
        color: var(--text);
        background-color: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 2rem;
        font-family: var(--font);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        -webkit-appearance: none;
        appearance: none;
      }
      .cp_input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(151, 171, 195, 0.25);
      }
      .cp_input:read-only {
        background-color: #ececec;
      }
      .cp_pass {
        box-sizing: border-box;
        padding: 0.5rem 1rem;
        width: 120px;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 1.8rem;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .cp_pass:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(151, 171, 195, 0.25);
      }

      /* ボタン */
      .cp_fileinput {
        display: none;
      }
      .cp_button,
      .cp_file {
        display: inline-block;
        -webkit-appearance: none;
        appearance: none;
        margin: 5px 0px 10px 0px;
        color: #fff;
        background-color: var(--accent);
        border-radius: 28px;
        border: 0px;
        padding: 1.5rem 0rem;
        font-size: 2rem;
        font-family: var(--font);
        outline: none;
        cursor: pointer;
        transition:
          background-color 0.15s,
          transform 0.1s;
      }
      .cp_button:hover,
      .cp_file:hover {
        background-color: var(--accent-dark);
      }
      .cp_button:disabled {
        background-color: #7d7d7d;
        cursor: default;
      }
      .cp_button:active,
      .cp_file:active {
        background-color: var(--accent-dark);
        transform: scale(0.98);
        outline: none;
      }

      /* OCRステータス */
      .ocr_status {
        font-size: 1.3rem;
        color: #666;
        margin: -5px 0 5px 0;
        min-height: 1.8em;
        text-align: left;
      }
      .ocr_status.processing {
        color: var(--accent);
      }
      .ocr_status.done {
        color: #4a9a4a;
      }
      .ocr_status.failed {
        color: #aaa;
      }
      #imageDisplay.is-pdf {
        width: 150px;
      }

      /* セレクト */
      .cp_select {
        display: block;
        position: relative;
        margin: 10px 0px;
      }
      .cp_select::after {
        position: absolute;
        right: 15px;
        top: 50%;
        margin-top: -3px;
        width: 10px;
        height: 7px;
        background-color: #535353;
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        content: "";
        pointer-events: none;
      }
      .cp_select select {
        appearance: none;
        -webkit-appearance: none;
        box-sizing: border-box;
        width: 100%;
        height: 6rem;
        padding: 0 calc(1.3rem + 30px) 0 1.3rem;
        border: 1px solid var(--border);
        outline: 0px;
        border-radius: var(--radius);
        background-color: #fff;
        color: var(--text);
        font-size: 2rem;
        font-family: var(--font);
        cursor: pointer;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .cp_select select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(151, 171, 195, 0.25);
      }
    </style>
    <script type="text/javascript">
      const MSG = {
        DONE: '完了しました。（出力先: <a href="https://drive.google.com/drive/folders/[replace]" target="_blank">GDrive</a>）<br><img src="./assets/done.png">',
        WAITING: '処理中...しばらくお待ち下さい。<div class="spinner"></div>',
        ERROR: '<span class="cp_error">エラーが発生しました。</span><br>',
        REQUEST_ERROR:
          '<span class="cp_error">リクエストが失敗しました。</span><br>',
        REQUIRED_ERROR:
          '<span class="cp_error">必須項目エラー</span><br>入力されていない項目があります。',
      };
      const CONF = {
        DEPLOY_ID:
          "AKfycbw6DhFdeqjNh85-oKD5dMznZYwsHnHY88MWPO2Ya8bOX7kRzfQAYRGtGIdoDSbpA5NbpQ",
      };
      let ocrXhr = null;
      let ocrTimer = null;

      function $id(id) {
        return document.getElementById(id);
      }

      //サーバー応答など外部由来の文字列をHTMLに挿入する前にエスケープする
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      document.addEventListener("DOMContentLoaded", function () {
        //フォームを初期化
        initForm();

        // GASウォームアップ（コールドスタート対策）
        fetch(
          "https://script.google.com/macros/s/" + CONF.DEPLOY_ID + "/exec",
        ).catch(() => {});

        //セレクトが選択された
        $id("preset").addEventListener("change", function () {
          //テンプレート適用
          $id("memo").value = this.value;
        });

        // 画像選択時にアップロード用情報をセットし、リサイズ処理を行う
        $id("fileinput").addEventListener("change", function () {
          let file = this.files[0];
          if (!file) {
            return;
          }
          let fr = new FileReader();
          fr.onload = function (e) {
            // アップロード用情報をセット
            $id("filename").value = file.name;
            $id("filetype").value = file.type;

            if (file.type !== "image/jpeg" && file.type !== "image/png") {
              //リサイズしない
              $id("fileuri").value = e.target.result.replace(/^.*,/, "");
              sendOCR();
              if (file.type === "application/pdf") {
                $id("imageDisplay").src = "assets/pdf.svg";
                $id("imageDisplay").classList.add("is-pdf");
              }
            } else {
              // 画像リサイズ処理
              let img = new Image();
              img.onload = function () {
                let canvas = document.createElement("canvas");
                let ctx = canvas.getContext("2d");
                let max_size = 2400; // リサイズ後の最大サイズ（横幅・高さの大きい方に合わせる）
                let width = img.width;
                let height = img.height;
                if (width > height) {
                  if (width > max_size) {
                    height *= max_size / width;
                    width = max_size;
                  }
                } else {
                  if (height > max_size) {
                    width *= max_size / height;
                    height = max_size;
                  }
                }
                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);
                // リサイズ後の画像をbase64形式に変換してアップロード用情報にセット
                let resized_image_data = canvas.toDataURL(file.type);
                $id("fileuri").value = resized_image_data.replace(/^.*,/, "");

                // OCR用に1000px以下の別画像を生成（転送サイズ削減）
                const OCR_SIZE = 1000;
                const ocrScale = Math.min(
                  OCR_SIZE / width,
                  OCR_SIZE / height,
                  1,
                );
                const ocrCanvas = document.createElement("canvas");
                ocrCanvas.width = Math.round(width * ocrScale);
                ocrCanvas.height = Math.round(height * ocrScale);
                ocrCanvas
                  .getContext("2d")
                  .drawImage(img, 0, 0, ocrCanvas.width, ocrCanvas.height);
                sendOCR(ocrCanvas.toDataURL(file.type).replace(/^.*,/, ""));
              };
              img.src = e.target.result;

              //選択した画像を表示する
              $id("imageDisplay").src = e.target.result;
            }
          };
          fr.readAsDataURL(file);
        });
      });

      //SUBMITボタン押下時にファイルをアップロードする
      function sendFile() {
        //入力チェック
        if (!checkForm()) {
          return false;
        }

        //結果ボックスを表示
        const resultTable = $id("result_table");
        resultTable.style.display = "block";
        resultTable.innerHTML = MSG.WAITING;

        const form = document.querySelector("form");
        const xhr = new XMLHttpRequest();
        const actionURL =
          "https://script.google.com/macros/s/" + CONF.DEPLOY_ID + "/exec";
        xhr.open("POST", actionURL);

        // フォームデータを取得し、送信する
        const formData = new FormData(form);
        xhr.send(formData);
        setFormDisabled(true);

        // レスポンスが受信された場合の処理
        xhr.onload = () => {
          if (xhr.status === 200) {
            const res = JSON.parse(xhr.responseText);
            const result = res.result;

            if (result == "ok") {
              resultTable.innerHTML = MSG.DONE.replace(
                "[replace]",
                encodeURIComponent(String(res.folderId)),
              );
              //アップロードファイルをクリア
              initForm();
            } else {
              resultTable.innerHTML = MSG.ERROR + escapeHtml(result);
            }
          } else {
            resultTable.innerHTML = MSG.REQUEST_ERROR + xhr.status;
          }
          setFormDisabled(false);
        };
        //actionに遷移させない
        return false;
      }

      //入力フォームの必須チェック
      function checkForm() {
        if (
          $id("date").value == "" ||
          $id("memo").value == "" ||
          $id("fileuri").value == "" ||
          $id("price").value == ""
        ) {
          const resultTable = $id("result_table");
          resultTable.style.display = "block";
          resultTable.innerHTML = MSG.REQUIRED_ERROR;
          return false;
        } else {
          return true;
        }
      }

      //入力フォームを初期化
      function initForm() {
        if (ocrXhr) {
          ocrXhr.abort();
          ocrXhr = null;
        }
        if (ocrTimer) {
          clearInterval(ocrTimer);
          ocrTimer = null;
        }
        $id("date").value = "";
        $id("preset").value = "";
        $id("memo").value = "";
        $id("price").value = "";
        $id("fileuri").value = "";
        $id("filename").value = "";
        $id("fileinput").value = "";
        $id("ocr_status").className = "ocr_status";
        $id("ocr_status").textContent = "";
        $id("imageDisplay").classList.remove("is-pdf");
        $id("imageDisplay").src = "assets/blank.png";
      }

      // 画像選択後にOCRを実行し、日付・金額を自動入力する
      function sendOCR(fileuriOverride) {
        const password = document.querySelector('input[name="password"]').value;
        const fileuri = fileuriOverride || $id("fileuri").value;
        const filetype = $id("filetype").value;
        const status = $id("ocr_status");
        if (!password) {
          status.className = "ocr_status failed";
          status.textContent = "OCRにはパスワードが必要です";
          return;
        }
        if (!fileuri) return;

        const ocrStart = Date.now();
        ocrTimer = setInterval(() => {
          const sec = (Date.now() - ocrStart) / 1000;
          const pct = Math.min(90, Math.round(90 * (1 - Math.exp(-sec / 2))));
          status.className = "ocr_status processing";
          status.textContent = "OCR処理中... " + pct + "%";
        }, 300);

        const formData = new FormData();
        formData.append("action", "ocr");
        formData.append("password", password);
        formData.append("fileuri", fileuri);
        formData.append("filetype", filetype);

        ocrXhr = new XMLHttpRequest();
        ocrXhr.open(
          "POST",
          "https://script.google.com/macros/s/" + CONF.DEPLOY_ID + "/exec",
        );
        ocrXhr.onload = () => {
          clearInterval(ocrTimer);
          ocrTimer = null;
          try {
            const res = JSON.parse(ocrXhr.responseText);
            console.log("OCR response:", res);
            if (res.result === "ok") {
              const filled = [];
              const skipped = [];
              if (res.date) {
                if (!$id("date").value) {
                  $id("date").value = res.date;
                  filled.push("日付");
                } else skipped.push("日付");
              }
              if (res.price) {
                if (!$id("price").value) {
                  $id("price").value = res.price;
                  filled.push("金額");
                } else skipped.push("金額");
              }
              let msg;
              if (filled.length > 0 && skipped.length > 0) {
                msg = `OCR完了（${filled.join("・")}を自動入力、${skipped.join("・")}はスキップ）`;
              } else if (filled.length > 0) {
                msg = `OCR完了（${filled.join("・")}を自動入力）`;
              } else if (skipped.length > 0) {
                msg = `OCR完了（入力済みのためスキップ）`;
              } else {
                msg = "OCR完了（読み取り不可）";
              }
              status.className = "ocr_status done";
              status.textContent = msg;
            } else {
              console.error("OCR error:", res.result);
              status.className = "ocr_status failed";
              status.textContent = "OCR失敗: " + res.result;
            }
          } catch (e) {
            console.error("OCR parse error:", e, ocrXhr.responseText);
            status.className = "ocr_status failed";
            status.textContent = "OCR応答エラー";
          }
        };
        ocrXhr.onerror = () => {
          clearInterval(ocrTimer);
          ocrTimer = null;
          status.className = "ocr_status failed";
          status.textContent = "OCR通信エラー";
        };
        ocrXhr.send(formData);
      }

      //フォーム入力可/不可切替
      function setFormDisabled(lock) {
        $id("date").readOnly = lock;
        $id("memo").readOnly = lock;
        $id("price").readOnly = lock;

        $id("preset").disabled = lock;
        $id("fileinput").disabled = lock;
        $id("upload_button").disabled = lock;
      }
    </script>
  </head>
  <body>
    <header>
      <img src="./assets/icon.png" width="32px" /><br />
      <b>レシートアップローダ</b>
    </header>
    <main class="cat_top">
      <div class="cp_contents">
        <form method="post" onsubmit="return sendFile();">
          <table width="100%">
            <td align="right">
              <small>pass:</small>
              <input type="password" name="password" class="cp_pass" />
            </td>
          </table>

          <input type="file" id="fileinput" class="cp_fileinput" />
          <label for="fileinput" class="cp_file">ファイル選択/撮影</label>
          <input
            type="text"
            id="filename"
            class="cp_input"
            placeholder="---"
            readonly
          />
          <div id="ocr_status" class="ocr_status"></div>

          <div class="cp_sparater"></div>
          <label class="cp_select">
            <select name="preset" id="preset">
              <option value="">―― 支払先を選択する ――</option>
              <option value="TEPCO（●月20日〜●月19日分）">TEPCO</option>
              <option value="東京水道局（●、●、●月分）">東京水道局</option>
              <option value="KDDI（●月請求 ●月利用分）">KDDI</option>
              <option value="GMOインターネット（●月分）">
                GMOインターネット
              </option>
              <option value="Microsoft（Office365 ●月分）">Office365</option>
              <option value="●（会議費）">会議費</option>
              <option value="●（交際費）">交際費</option>
              <option value="">その他</option>
            </select>
          </label>
          <input
            type="text"
            name="memo"
            id="memo"
            placeholder="支払先の備考を入力する"
            class="cp_input"
          />

          <div class="cp_sparater"></div>
          <input
            type="date"
            name="date"
            id="date"
            class="cp_input"
            autocomplete="off"
          />
          <input
            type="number"
            name="price"
            id="price"
            class="cp_input"
            min="1"
            max="99999"
            placeholder="価格（税込）を入力する"
          />

          <div class="cp_sparater"></div>
          <div id="result_table" class="result-table"></div>
          <input
            type="submit"
            value="アップロードする"
            id="upload_button"
            class="cp_button"
          />

          <div class="cp_sparater"></div>
          <a href="JavaScript:initForm();"><small>クリアする</small></a
          ><br /><br />
          <input type="hidden" name="fileuri" id="fileuri" />
          <input type="hidden" name="filetype" id="filetype" />
          <img
            id="imageDisplay"
            src="assets/blank.png"
            alt="Image Preview"
            width="100%"
          />
        </form>
      </div>
    </main>
  </body>
</html>
